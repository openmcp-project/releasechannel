components:
  - name: ${OCM_COMPONENT_PREFIX}/external-secrets-operator
    version: v2.4.1
    labels: []
    provider:
      name: ${PROVIDER}
    resources:
      - name: external-secrets
        version: v2.4.1
        type: helmChart
        access:
          type: helm
          # renovate: datasource=helm depName=external-secrets registryUrl=https://charts.external-secrets.io
          helmChart: external-secrets:2.4.1
          helmRepository: https://charts.external-secrets.io
      - name: image-external-secrets
        version: v2.4.1
        type: ociImage
        access:
          type: ociArtifact
          # renovate: datasource=docker depName=ghcr.io/external-secrets/external-secrets
          imageReference: ghcr.io/external-secrets/external-secrets:v2.4.1
  - name: ${OCM_COMPONENT_PREFIX}/external-secrets-operator
    version: v1.3.2
    labels: []
    provider:
      name: ${PROVIDER}
    resources:
      - name: external-secrets
        version: v1.3.2
        type: helmChart
        access:
          type: helm
          helmChart: external-secrets:1.3.2
          helmRepository: https://charts.external-secrets.io
      - name: image-external-secrets
        version: v1.3.2
        type: ociImage
        access:
          type: ociArtifact
          imageReference: ghcr.io/external-secrets/external-secrets:v1.3.2
