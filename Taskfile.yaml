version: "3"

vars:
  OCM_COMPONENT_PREFIX: "github.com/openmcp-project/releasechannel"
  OCM_COMPONENT_PROVIDER: "openmcp-project"
  RELEASECHANNEL_COMPONENT_NAME: "{{.OCM_COMPONENT_PREFIX}}"
  REPO_URL: "github.com/openmcp-project/releasechannel"
  VERSION:
    sh: "cat VERSION"
  COMMIT:
    sh: '( cd "{{.ROOT_DIR}}"; git rev-parse HEAD 2>/dev/null || echo "unknown" )'

  OCM_TARGET_REPO: '{{.OCM_TARGET_REPO | default "ghcr.io/openmcp-project/components"}}'
  OCM_CONFIG: '{{.OCM_CONFIG | default ""}}'

  COMPONENTS_DIR: "{{.ROOT_DIR}}/components"
  OCM_OUTPUT_DIR: "{{.ROOT_DIR}}/.ctf"
  OCM_SIGNING_CONFIG: "{{.ROOT_DIR}}/signing.yaml"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build OCM transport archive from component descriptors
    env:
      OCM_COMPONENT_PREFIX: "{{.OCM_COMPONENT_PREFIX}}"
      RELEASECHANNEL_COMPONENT_NAME: "{{.RELEASECHANNEL_COMPONENT_NAME}}"
      VERSION: "{{.VERSION}}"
      PROVIDER: "{{.OCM_COMPONENT_PROVIDER}}"
      REPO_URL: "{{.REPO_URL}}"
    cmds:
      - |
        for f in {{.COMPONENTS_DIR}}/*.yaml; do
          [ "$(basename "$f")" = "releasechannel.yaml" ] && continue
          ocm add component-version \
            --repository "CTF::{{.OCM_OUTPUT_DIR}}" \
            --constructor "$f" \
            --component-version-conflict-policy replace
        done
      - |
        ocm add component-version \
          --repository "CTF::{{.OCM_OUTPUT_DIR}}" \
          --constructor {{.COMPONENTS_DIR}}/releasechannel.yaml \
          --component-version-conflict-policy replace

  ocm:sign:
    desc: Sign every OCM component version in the transport archive keyless with Sigstore. It must have been built before.
    cmds:
      - |
        ocm get component-version "CTF::{{.OCM_OUTPUT_DIR}}" -o json |
          jq -r '.[] | "\(.component.name):\(.component.version)"' |
          while read -r component; do
            ocm sign component-version --config "{{.OCM_SIGNING_CONFIG}}" "CTF::{{.OCM_OUTPUT_DIR}}//$component" || exit 1
          done

  ocm:publish:
    desc: Publish OCM components to the target OCI registry. Fails if the releasechannel version exists, unless OVERWRITE_COMPONENTS is "true".
    env:
      OCM_TARGET_REF: "{{.OCM_TARGET_REPO}}//{{.OCM_COMPONENT_PREFIX}}:{{.VERSION}}"
    cmds:
      # ocm replaces existing versions and has no flag to prevent it.
      - |
        if [ "${OVERWRITE_COMPONENTS:-false}" = "true" ]; then
          exit 0
        fi
        if ocm get component-version {{if .OCM_CONFIG}}--config "{{.OCM_CONFIG}}"{{end}} "$OCM_TARGET_REF"; then
          echo "$OCM_TARGET_REF already exists. Set OVERWRITE_COMPONENTS to 'true' to overwrite it." >&2
          exit 1
        fi
      - |
        ocm transfer component-version \
          {{if .OCM_CONFIG}}--config "{{.OCM_CONFIG}}" \{{end}}
          --copy-resources \
          --upload-as localBlob \
          --recursive \
          "CTF::{{.OCM_OUTPUT_DIR}}//{{.OCM_COMPONENT_PREFIX}}:{{.VERSION}}" \
          {{.OCM_TARGET_REPO}}

  ocm:inspect:
    desc: Show what was built
    cmds:
      - ocm get components --recursive -o tree "CTF::{{.OCM_OUTPUT_DIR}}"//{{.OCM_COMPONENT_PREFIX}}

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.OCM_OUTPUT_DIR}}
