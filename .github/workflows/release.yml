name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.create-tag.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Create tag if not exists
        id: create-tag
        run: |
          TAG="${{ steps.version.outputs.version }}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    runs-on: ubuntu-latest
    needs: tag
    if: needs.tag.outputs.created == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.version }}

      - name: Install ocm CLI
        run: curl -sfL https://ocm.software/install-cli.sh | bash

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Build
        run: task build

      - name: Generate inspect output
        id: inspect
        run: |
          {
            echo "tree<<EOF"
            task ocm:inspect
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo '```' >> $GITHUB_STEP_SUMMARY
          task ocm:inspect >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.OPENMCP_CI_APP_ID }}
          private-key: ${{ secrets.OPENMCP_CI_APP_PRIVATE_KEY }}
          owner: openmcp-project

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ steps.app-token.outputs.token }}

      - name: Publish
        run: task ocm:publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.version }}
          name: ${{ needs.tag.outputs.version }}
          body: |
            ## Build Summary for ${{ needs.tag.outputs.version }}

            ### Components Built:
            ```txt
            ${{ steps.inspect.outputs.tree }}
            ```

            ### OCM Target Repository:
            - ghcr.io/openmcp-project/components
          generate_release_notes: true
