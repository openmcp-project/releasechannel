name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.create-tag.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Create tag if not exists
        id: create-tag
        run: |
          TAG="${{ steps.version.outputs.version }}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    runs-on: ubuntu-latest
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write # sign the component versions with the workflow identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.tag.outputs.version }}

      - name: Install ocm CLI
        run: curl -sfL https://ocm.software/install-cli.sh | bash

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0

      - name: Build
        run: task build

      - name: Generate inspect output
        id: inspect
        run: |
          {
            echo "tree<<EOF"
            task ocm:inspect
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo '```' >> $GITHUB_STEP_SUMMARY
          task ocm:inspect >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.4

      - name: Sign
        run: task ocm:sign

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write OCM config
        run: |
          set -euo pipefail
          cat > "$HOME/.ocmconfig" <<EOF
          type: generic.config.ocm.software/v1
          configurations:
            - type: http.config.ocm.software/v1alpha1
              timeout: 10m
              retry:
                maxRetries: 3
                maxWait: 10s
            - type: credentials.config.ocm.software
              repositories:
                - repository:
                    type: DockerConfig/v1
                    dockerConfigFile: $HOME/.docker/config.json
                    propagateConsumerIdentity: true
          EOF

      - name: Publish
        run: task ocm:publish OCM_CONFIG="$HOME/.ocmconfig"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.tag.outputs.version }}
          name: ${{ needs.tag.outputs.version }}
          body: |
            ## Build Summary for ${{ needs.tag.outputs.version }}

            ### Components Built:
            ```txt
            ${{ steps.inspect.outputs.tree }}
            ```

            ### OCM Target Repository:
            - ghcr.io/openmcp-project/components
          generate_release_notes: true
