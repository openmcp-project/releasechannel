name: CI

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ocm CLI
        run: curl -sfL https://ocm.software/install-cli.sh | bash

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0

      - name: Build
        run: task build

      - name: Inspect
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          task ocm:inspect >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          task ocm:inspect
